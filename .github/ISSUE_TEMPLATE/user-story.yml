name: User story / feature
description: A feature from the project overview
title: "[US-XX] "
labels: ["type: feature"]
body:
  - type: input
    id: story
    attributes:
      label: User story
      placeholder: As a <actor>, I want <goal>, so that <benefit>
    validations: { required: true }
  - type: input
    id: ref
    attributes:
      label: Overview reference
      placeholder: e.g. US-05, §7.1
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Copy from the overview. Each becomes a checkbox.
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Which §10.0 principles apply? Any new threat-model rows?
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: How it will be tested
