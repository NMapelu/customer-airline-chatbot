name: Task
description: A build step from the build guide
labels: ["type: chore"]
body:
  - type: input
    id: step
    attributes:
      label: Build guide step
      placeholder: e.g. Phase 1, step 1.3
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ]
    validations: { required: true }
