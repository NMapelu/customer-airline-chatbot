# Weekly dependency updates (overview §15.3). Every Dependabot PR goes through the same CI and
# security scans as any other change. Next.js and OpenNext move together, so they are grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-and-opennext:
        patterns: ['next', '@opennextjs/*', 'wrangler', 'eslint-config-next']
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
