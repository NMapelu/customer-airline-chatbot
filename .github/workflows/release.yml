name: Release

# Every merge to main (overview §15.3): build once, deploy that build to staging, attack it there
# (ZAP full scan signed in, access tests, LLM red team), then promote the same build to production
# once the owner approves the production environment. A failed smoke test rolls production back
# to the version before.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases go out one at a time and in order; none is cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  STAGING_URL: https://kq-policy-assistant-staging.neema-mapelu.workers.dev
  PRODUCTION_URL: https://kq-policy-assistant.neema-mapelu.workers.dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      - run: node scripts/scan-bundle.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ github.sha }}
          path: .open-next
          include-hidden-files: true
          retention-days: 30
      - name: Bill of materials for this release
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-release-${{ github.sha }}.cdx.json
          upload-release-assets: false

  staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    outputs:
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ github.sha }}
          path: .open-next
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --env staging
      - run: scripts/ci/wait-for-site.sh "$STAGING_URL"

  staging-scans:
    name: Staging scans
    needs: staging
    uses: ./.github/workflows/dynamic-scans.yml
    with:
      base-url: ${{ needs.staging.outputs.url }}
      zap: full
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
      TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
      TEST_CUSTOMER_TOTP_SECRET: ${{ secrets.TEST_CUSTOMER_TOTP_SECRET }}
      TEST_AGENT_EMAIL: ${{ secrets.TEST_AGENT_EMAIL }}
      TEST_AGENT_PASSWORD: ${{ secrets.TEST_AGENT_PASSWORD }}
      TEST_AGENT_TOTP_SECRET: ${{ secrets.TEST_AGENT_TOTP_SECRET }}

  production:
    name: Promote to production
    needs: staging-scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: waits for the owner's approval and only accepts main.
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ github.sha }}
          path: .open-next
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
      - name: Smoke test
        run: scripts/ci/wait-for-site.sh "$PRODUCTION_URL"
      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback --yes --message "Smoke test failed for ${GITHUB_SHA::7}"
