name: Preview

# Every pull request is deployed to the preview Worker and attacked there before it can merge
# (overview §15.2): ZAP baseline, access-control tests and the LLM red team. The preview Worker has
# its own secrets (set once with `wrangler secret put --env preview`); GitHub only holds the
# Cloudflare deploy token and the test accounts.

on:
  pull_request:

permissions:
  contents: read

# One preview Worker, so one pull request at a time; a newer push to the same PR replaces the run.
concurrency:
  group: preview
  cancel-in-progress: false

env:
  PREVIEW_URL: https://kq-policy-assistant-preview.neema-mapelu.workers.dev

jobs:
  deploy:
    name: Deploy the preview Worker
    # Secrets aren't given to pull requests from forks or Dependabot; their changes get the
    # pre-merge scans only, and are scanned on staging after merging.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ env.PREVIEW_URL }}
    outputs:
      url: ${{ env.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx opennextjs-cloudflare build
          node scripts/scan-bundle.mjs
          npx opennextjs-cloudflare deploy --env preview
      - name: Wait for the new version
        run: scripts/ci/wait-for-site.sh "$PREVIEW_URL"

  scans:
    name: Dynamic scans
    needs: deploy
    uses: ./.github/workflows/dynamic-scans.yml
    with:
      base-url: ${{ needs.deploy.outputs.url }}
      zap: baseline
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
      TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
      TEST_CUSTOMER_TOTP_SECRET: ${{ secrets.TEST_CUSTOMER_TOTP_SECRET }}
      TEST_AGENT_EMAIL: ${{ secrets.TEST_AGENT_EMAIL }}
      TEST_AGENT_PASSWORD: ${{ secrets.TEST_AGENT_PASSWORD }}
      TEST_AGENT_TOTP_SECRET: ${{ secrets.TEST_AGENT_TOTP_SECRET }}
